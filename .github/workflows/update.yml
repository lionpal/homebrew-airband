name: Update the formula
# Looks for a new airband release (https://airband.dev/releases/latest.json) and updates Formula/airband.rb.
# Runs a few times a day, and by hand from the Actions tab.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
concurrency: { group: update, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ./update.sh
      - name: Commit if the formula changed
        run: |
          if git diff --quiet; then echo "nothing new"; exit 0; fi
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/airband.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "airband $version"
          git push
